  :root { --gold: #cdb98e; --cream: #f2efe8; --muted: #9c968b; --bg: #111; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: "PageSerif", "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", serif; font-weight: 400; color: var(--cream);
    min-height: 100vh; min-height: 100dvh; padding: 10px;
    background: radial-gradient(ellipse 120% 45% at 50% 22%, #1f1d1a 0%, var(--bg) 70%) fixed;
  }
  .frame { max-width: 440px; margin: 0 auto; border: 1px solid #6f6a62; padding: 4px;
           min-height: calc(100dvh - 20px); display: flex; }
  .inner { flex: 1; border: 1px solid #3c3a36; padding: 18px 18px 16px;
           display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .top { font-size: 12px; letter-spacing: 4px; padding-left: 4px; color: var(--gold); font-weight: 300; }

  .title { display: block; width: 72%; }
  .sub { display: flex; align-items: center; gap: 12px; margin: 10px 0 16px; }
  .sub i { width: 24px; height: 1px; background: var(--gold); opacity: .6; }
  .sub span { font-size: 14px; letter-spacing: 5px; padding-left: 5px; font-weight: 300; color: #e2ded5; }

  .card { width: 100%; position: relative; border: 1px solid #2f2d2a; border-radius: 16px;
          padding: 14px 16px 14px; margin-bottom: 10px;
          background: linear-gradient(180deg, #1b1a18 0%, #151413 100%); }
  .card::before { display: none; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .head > div { flex: 1; text-align: center; }
  .name { font-size: 18px; letter-spacing: 4px; padding-left: 4px; font-weight: 500; }
  .slogan { font-size: 12px; letter-spacing: 0.5px; white-space: nowrap; color: var(--gold); font-weight: 300; }
  .btns { display: flex; gap: 10px; }
  .btn { flex: 1; text-align: center; padding: 10px 0; border-radius: 999px; font-size: 14px;
         letter-spacing: 2px; font-weight: 500; text-decoration: none; cursor: pointer; font-family: inherit;
         -webkit-tap-highlight-color: transparent; transition: transform .1s; }
  .btn:active { transform: scale(.97); }
  .primary { background: var(--cream); color: #111; border: 1px solid var(--cream); }
  .ghost { background: transparent; color: #e2ded5; border: 1px solid #4a4743; font-weight: 400; }

  .foot { margin-top: 0; padding-top: 18px; font-size: 13px; letter-spacing: 4px; padding-left: 4px; font-weight: 300; color: #e2ded5; }
  .foot b { color: var(--gold); font-weight: 400; margin: 0 2px; }

  .top { margin-top: 6px; }
  .loc { margin-top: 10px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px;
         padding: 10px 12px 10px; border: 1px solid #3a3733; border-radius: 14px; text-decoration: none;
         color: #e2ded5; -webkit-tap-highlight-color: transparent; text-align: center;
         background: linear-gradient(180deg, #1b1a18 0%, #151413 100%); }
  .loc .l1, .loc .l2 { font-size: 13px; letter-spacing: 0.5px; font-weight: 300; white-space: nowrap; }
  .loc .l1 { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
  .loc svg { color: var(--gold); width: 14px; height: 14px; flex: none; }
  .loc em { margin-top: 5px; font-style: normal; color: var(--gold); font-size: 12px; letter-spacing: 2px;
            padding: 3px 14px; border: 1px solid rgba(205,185,142,.45); border-radius: 999px; }
  .loc:active { opacity: .7; }
  @media (max-width: 360px) { .inner { padding-left: 14px; padding-right: 14px; } .loc .l2 { font-size: 12.5px; letter-spacing: 0; } }
  @media (max-height: 640px) {
    .inner { padding-top: 12px; padding-bottom: 12px; }
    .avatar { width: 56px; height: 56px; margin: 2px 0 8px; }
    .title { width: 64%; }
    .sub { margin: 8px 0 12px; }
    .card { padding: 12px 14px; margin-bottom: 8px; }
    .head { margin-bottom: 8px; }
    .btn { padding: 9px 0; }
    .foot { padding-top: 10px; }
    .loc { margin-top: 8px; padding: 8px 12px; }
  }
  .toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
           background: rgba(242,239,232,.95); color: #111; padding: 10px 18px; border-radius: 20px;
           font-size: 14px; letter-spacing: 1px; opacity: 0; transition: opacity .25s;
           pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
