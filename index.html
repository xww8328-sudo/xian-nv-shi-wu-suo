      <a class="btn primary" href="https://v.douyin.com/3h1VxmtpF1s/" target="_blank">打开主页</a>
      <button class="btn ghost" onclick="copy(DY_CODE, '抖音')">复制口令</button>

</div></div>
<div class="toast" id="toast"></div>

<script>
  const DY_CODE = "3- 长按复制此条消息，打开抖音搜索，查看TA的更多作品。 https://v.douyin.com/3h1VxmtpF1s/ 0@9.com :3pm";
  const XHS_CODE = "我在小红书收获了112次赞与收藏，点击链接或复制口令来看我的主页>> https://xhslink.cn/o/2v5tYiVJvfI";

  function toast(msg) {
    const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }
  function copy(text, label, doneMsg) {
    const done = () => toast(doneMsg || `已复制，打开${label}即可看到主页`);
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallback(text, done));
    } else fallback(text, done);
  }
  function fallback(text, done) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("复制失败，请长按手动复制"); }
    document.body.removeChild(ta);
  }
</script>
</body>
