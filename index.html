  .title { display: block; width: 82%; margin: 0 auto; }
  .sub {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: 14px; letter-spacing: 6px; color: #d9d5cc; margin: 18px 0 26px;
  }
  .sub::before, .sub::after { content: ""; width: 36px; height: 1px; background: #777; }
  .tip {
    display: none; border: 1px dashed #8a7a4a; color: #e2cf94; font-size: 13px;
    line-height: 1.7; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
  }
  .card {
    background: #1d1d1d; border: 1px solid #2e2e2e; border-radius: 16px;
    padding: 18px; margin-bottom: 14px;
  }
  .card-top { margin-bottom: 14px; }
  .label { font-size: 17px; font-weight: 600; letter-spacing: 2px; }
  .id { font-size: 13px; color: #9a968e; margin-top: 4px; letter-spacing: 1px; }
  .btns { display: flex; gap: 10px; }
  .wxqr { display: block; width: 200px; height: 200px; margin: 2px auto 12px; border-radius: 12px; }
  .wxhint { text-align: center; font-size: 12px; color: #9a968e; margin: -4px 0 12px; }
  .btn {
    flex: 1; text-align: center; padding: 12px 0; border-radius: 999px; font-size: 15px;
